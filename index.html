<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🌤 Weather Forecast</h1>
    <p class="subtitle">Know today's weather instantly</p>

    <div class="weather-card">

        <h2>Jaipur</h2>

        <div class="temp">31°C</div>

        <div class="condition">☀️ Sunny</div>

        <div class="details">

            <div>
                <h3>Humidity</h3>
                <p>58%</p>
            </div>

            <div>
                <h3>Wind</h3>
                <p>14 km/h</p>
            </div>

            <div>
                <h3>Pressure</h3>
                <p>1012 hPa</p>
            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
